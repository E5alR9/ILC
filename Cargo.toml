[package]
name = "nanomidi"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
enigo = "0.6.1"
fastrand = "2.5.0"
global-hotkey = "0.10.0"
midir = "0.11.1"
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
